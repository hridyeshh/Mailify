<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>User Details - Mail Sender</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#141414",
                        "background-light": "#f7f7f7",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-dark font-display">
    <div class="relative flex h-auto min-h-screen w-full flex-col bg-background-dark dark group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
            <div class="px-4 md:px-40 flex flex-1 justify-center py-5">
                <div class="layout-content-container flex flex-col max-w-[480px] flex-1">
                    <div class="flex flex-col gap-8 py-10">
                        <!-- Header -->
                        <div class="flex flex-col gap-4">
                            <div class="flex flex-wrap justify-between gap-3 p-4">
                                <p class="text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">Tell us about yourself</p>
                            </div>

                            <!-- Notification Area -->
                            <div id="notification" class="hidden mx-4"></div>

                            <!-- Form -->
                            <form id="userDetailsForm" class="flex flex-col gap-4 px-4">
                                <label class="flex flex-col min-w-40 flex-1">
                                    <p class="text-white text-base font-medium leading-normal pb-2">Name <span class="text-red-400">*</span></p>
                                    <input 
                                        id="userName"
                                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-white/50 border border-white bg-black h-14 placeholder:text-[#adadad] p-[15px] text-base font-normal leading-normal" 
                                        placeholder="Enter your full name"
                                        required
                                        value=""/>
                                </label>

                                <label class="flex flex-col min-w-40 flex-1">
                                    <p class="text-white text-base font-medium leading-normal pb-2">Email <span class="text-red-400">*</span></p>
                                    <input 
                                        id="userEmail"
                                        type="email"
                                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-white/50 border border-white bg-black h-14 placeholder:text-[#adadad] p-[15px] text-base font-normal leading-normal" 
                                        placeholder="your.email@gmail.com"
                                        required
                                        value=""/>
                                </label>

                                <label class="flex flex-col min-w-40 flex-1">
                                    <p class="text-white text-base font-medium leading-normal pb-2">Phone Number <span class="text-red-400">*</span></p>
                                    <input 
                                        id="userPhone"
                                        type="tel"
                                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-white/50 border border-white bg-black h-14 placeholder:text-[#adadad] p-[15px] text-base font-normal leading-normal" 
                                        placeholder="+1-234-567-8900"
                                        required
                                        value=""/>
                                </label>

                                <label class="flex flex-col min-w-40 flex-1">
                                    <p class="text-white text-base font-medium leading-normal pb-2">LinkedIn <span class="text-red-400">*</span></p>
                                    <input 
                                        id="userLinkedIn"
                                        type="url"
                                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-white/50 border border-white bg-black h-14 placeholder:text-[#adadad] p-[15px] text-base font-normal leading-normal" 
                                        placeholder="https://linkedin.com/in/yourprofile"
                                        required
                                        value=""/>
                                </label>

                                <div class="flex flex-col min-w-40 flex-1">
                                    <p class="text-white text-base font-medium leading-normal pb-2">Resume <span class="text-red-400">*</span></p>
                                    <div class="flex items-center justify-center w-full">
                                        <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-white border-dashed rounded-lg cursor-pointer bg-black hover:bg-zinc-900" for="dropzone-file">
                                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                                <span class="material-symbols-outlined text-white mb-2"> cloud_upload </span>
                                                <p class="mb-2 text-sm text-gray-400"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                                <p class="text-xs text-gray-500">PDF or DOC (MAX. 5MB)</p>
                                            </div>
                                            <input accept=".pdf,.doc,.docx" class="hidden" id="dropzone-file" type="file" required/>
                                        </label>
                                    </div>
                                    <div id="fileInfo" class="hidden mt-2 text-sm text-white/60">
                                        <span id="fileName" class="font-medium"></span>
                                        <button type="button" id="removeFile" class="ml-2 text-red-400 hover:text-red-300">Remove</button>
                                    </div>
                                </div>

                            </form>
                        </div>

                        <!-- Continue Button -->
                        <div class="px-4">
                            <button 
                                id="continueBtn"
                                type="submit"
                                form="userDetailsForm"
                                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 w-full px-4 bg-white text-black text-lg font-semibold leading-normal tracking-[-0.015em] hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <span id="btnText">Continue</span>
                                <span id="btnSpinner" class="hidden">
                                    <svg class="inline animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Saving...
                                </span>
                            </button>
                            
                            <!-- Skip Link -->
                            <div class="mt-4 text-center">
                                <a href="/composer" class="text-gray-400 hover:text-white text-sm underline">
                                    Skip this step (use default configuration)
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // File handling
        let selectedFile = null;

        // Check if user details already exist
        window.addEventListener('DOMContentLoaded', () => {
            const savedDetails = localStorage.getItem('userDetails');
            if (savedDetails) {
                const details = JSON.parse(savedDetails);
                document.getElementById('userName').value = details.name || '';
                document.getElementById('userEmail').value = details.email || '';
                document.getElementById('userPhone').value = details.phone || '';
                document.getElementById('userLinkedIn').value = details.linkedin || '';
            }

            // File upload handlers
            const fileInput = document.getElementById('dropzone-file');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const removeFile = document.getElementById('removeFile');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    // Validate file type
                    const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                    if (!allowedTypes.includes(file.type)) {
                        showNotification('Please upload a PDF or DOC file only.', 'error');
                        return;
                    }

                    // Validate file size (5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        showNotification('File size must be less than 5MB.', 'error');
                        return;
                    }

                    selectedFile = file;
                    fileName.textContent = file.name;
                    fileInfo.classList.remove('hidden');
                    showNotification('File uploaded successfully!', 'success');
                }
            });

            removeFile.addEventListener('click', () => {
                selectedFile = null;
                fileInput.value = '';
                fileInfo.classList.add('hidden');
            });

            // Drag and drop handlers
            const dropzone = fileInput.parentElement;
            
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('bg-zinc-900');
            });

            dropzone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropzone.classList.remove('bg-zinc-900');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('bg-zinc-900');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            });
        });

        // Notification system
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            
            notification.innerHTML = `
                <div class="${bgColor} text-white px-4 py-3 rounded-lg">
                    <div class="flex items-center justify-between">
                        <span class="text-sm">${message}</span>
                        <button onclick="this.parentElement.parentElement.parentElement.classList.add('hidden')" class="ml-4 text-white hover:text-gray-200">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            notification.classList.remove('hidden');
            
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 5000);
        }

        // URL validation
        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // Email validation
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Form validation
        function validateForm() {
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const linkedin = document.getElementById('userLinkedIn').value.trim();
            
            const errors = [];

            if (!name) {
                errors.push('Name is required');
            }

            if (!email) {
                errors.push('Email is required');
            } else if (!isValidEmail(email)) {
                errors.push('Please enter a valid email address');
            }

            if (!phone) {
                errors.push('Phone number is required');
            }

            if (!linkedin) {
                errors.push('LinkedIn profile is required');
            } else if (!isValidUrl(linkedin)) {
                errors.push('Please enter a valid LinkedIn URL');
            }

            if (!selectedFile) {
                errors.push('Resume file is required');
            }

            return errors;
        }

        // Toggle loading state
        function setLoading(loading) {
            const btn = document.getElementById('continueBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            
            btn.disabled = loading;
            if (loading) {
                btnText.classList.add('hidden');
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }


        // Form submit handler
        document.getElementById('userDetailsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate form
            const errors = validateForm();
            if (errors.length > 0) {
                showNotification(errors.join('<br>'), 'error');
                return;
            }

            setLoading(true);

            try {
                // Collect form data
                const userDetails = {
                    name: document.getElementById('userName').value.trim(),
                    email: document.getElementById('userEmail').value.trim(),
                    phone: document.getElementById('userPhone').value.trim(),
                    linkedin: document.getElementById('userLinkedIn').value.trim(),
                    resumeFilename: selectedFile ? selectedFile.name : 'hridyesh_resume.pdf'
                };

                // Save to localStorage
                localStorage.setItem('userDetails', JSON.stringify(userDetails));
                showNotification('Details saved successfully! Redirecting...', 'success');
                
                // Redirect to position & portfolio page
                setTimeout(() => {
                    window.location.href = '/position-portfolio.html';
                }, 1000);
            } catch (error) {
                showNotification('Failed to process file. Please try again.', 'error');
                setLoading(false);
            }
        });

        console.log('✅ User details setup page loaded');
    </script>
</body>
</html>
